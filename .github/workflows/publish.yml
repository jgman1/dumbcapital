name: Generate Posts & Deploy to Webfundament
on:
  workflow_dispatch:
  schedule:
    - cron: '15 16 * * 2,5'  # Tuesdays and Fridays at 12:15pm EST (16:15 UTC)
permissions:
  contents: write
jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_posts.py

      - name: Commit new posts and seen cache
        run: |
          git config user.name  "DumbCapital Bot"
          git config user.email "bot@dumbcapital.com"
          git add posts/
          git diff --staged --quiet || git commit -m "📰 Auto-post $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push

      - name: Tweet new articles
        env:
          TWITTER_API_KEY:             ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:          ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:        ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: python scripts/tweet_posts.py

      - name: Deploy via cPanel Git
        run: |
          curl -k -s "https://srv.dioartis.com:2083/execute/VersionControl/update" \
            -u "dumbcapi:${{ secrets.CPANEL_PASSWORD }}" \
            -d "repository=/home/dumbcapi/repositories/dumbcapital" \
            -d "branch=main"
          sleep 10
          curl -k -s "https://srv.dioartis.com:2083/execute/VersionControl/deploy" \
            -u "dumbcapi:${{ secrets.CPANEL_PASSWORD }}" \
            -d "repository=/home/dumbcapi/repositories/dumbcapital"
